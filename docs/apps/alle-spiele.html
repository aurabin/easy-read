<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alle Spiele — 28 Mini-Games</title>
<style>
/* AGA-Grundfarben */
:root{
 --c00:#000;--c01:#fff;--c02:#8b2e2e;--c03:#5ac8fa;--c04:#3a7d44;
 --c05:#f7d51d;--c06:#e0703c;--c07:#6a4a9c;--c08:#b03030;--c09:#87ceeb;
 --c10:#7fe08a;--c11:#ffe98a;--c12:#c0c0c0;--c13:#808080;--c14:#404040;--c15:#202020;
 --akz:var(--c05);
}
*{box-sizing:border-box}
body{margin:0;background:
 repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 1px,transparent 1px 3px),var(--c00);
 color:var(--c01);font:14px/1.5 "Courier New",Courier,monospace}
.wrap{max-width:980px;margin:0 auto;padding:16px 14px 60px}
h1{font-size:clamp(20px,4vw,30px);color:var(--c05);text-shadow:3px 3px 0 var(--c08);margin:0 0 6px}
.lead{color:var(--c03);margin:0 0 14px}
/* Header-Leiste */
.bar{background:var(--c04);color:var(--c00);padding:6px 10px;font-weight:bold;
 border:3px solid var(--c12);display:flex;justify-content:space-between;margin-bottom:14px}
/* Spiele-Raster */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.karte{background:var(--c15);border:3px solid var(--c12);padding:10px;cursor:pointer;
 box-shadow:inset 2px 2px 0 var(--c13),3px 3px 0 #000;transition:transform .1s}
.karte:hover{transform:translate(-2px,-2px);border-color:var(--akz)}
.karte .tag{font-size:10px;color:var(--akz);letter-spacing:.08em}
.karte h3{margin:4px 0;font-size:14px;color:var(--c01)}
.karte p{margin:0;font-size:11px;color:var(--c13)}
/* Spiel-Fenster */
#spiel{display:none;background:var(--c15);border:4px solid var(--c12);
 box-shadow:inset 0 0 30px #000,6px 6px 0 #000;margin-top:14px}
#spiel.offen{display:block}
.spkopf{background:var(--akz);color:var(--c00);padding:8px 12px;font-weight:bold;
 display:flex;justify-content:space-between;border-bottom:3px solid var(--c12)}
.spkopf button{font:inherit;background:var(--c00);color:var(--c01);border:2px solid var(--c12);cursor:pointer}
.spinhalt{padding:16px;min-height:220px}
.frage{font-size:17px;color:var(--c05);margin:0 0 12px}
.antworten{display:flex;flex-direction:column;gap:6px}
.antworten button{font:inherit;text-align:left;padding:8px 10px;cursor:pointer;
 background:var(--c07);color:var(--c01);border:2px solid var(--c12);box-shadow:inset 2px 2px 0 var(--c09)}
.antworten button:hover{background:var(--c08)}
.antworten button.right{background:var(--c04);color:var(--c00)}
.antworten button.wrong{background:var(--c02)}
.erk{margin-top:10px;padding:8px;background:var(--c00);border-left:4px solid var(--c05);color:var(--c10)}
.erk[hidden]{display:none}
.stand{margin-top:8px;color:var(--c13);font-size:12px}
.btn{font:inherit;font-weight:bold;padding:6px 12px;cursor:pointer;
 background:var(--c05);color:var(--c00);border:2px solid var(--c12);box-shadow:2px 2px 0 #000}
.btn[hidden]{display:none}
/* Klick-Spiel */
.klickfeld{height:180px;background:var(--c02);border:3px solid var(--c12);position:relative;overflow:hidden}
.klickball{position:absolute;width:38px;height:38px;border-radius:50%;
 background:radial-gradient(circle at 35% 30%,#f5f0e6,var(--c08));cursor:pointer;
 box-shadow:inset -3px -3px 0 rgba(0,0,0,.25)}
.klickball::before,.klickball::after{content:"";position:absolute;top:8px;width:5px;height:5px;background:#000;border-radius:50%}
.klickball::before{left:10px}.klickball::after{right:10px}
.poof{position:absolute;color:var(--c05);font-weight:bold;pointer-events:none;animation:pop .6s forwards}
@keyframes pop{to{transform:translateY(-35px);opacity:0}}
.konfetti{position:fixed;width:8px;height:8px;pointer-events:none;z-index:99;animation:fall 1s forwards}
@keyframes fall{to{transform:translateY(100vh) rotate(720deg);opacity:0}}
.high{color:var(--c05)}
.rang{font-size:12px;color:var(--c11)}
footer{text-align:center;color:var(--c13);font-size:11px;padding:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>ALLE SPIELE</h1>
  <p class="lead">28 Mini-Spiele. Eins für jedes Thema. Klick auf eine Karte.</p>
  <div class="bar"><span>SPIEL-AUSWAHL</span><span>AGA · 64 FARBEN</span></div>
  <div class="grid" id="grid"></div>

  <div id="spiel">
    <div class="spkopf"><span id="sptitel">Spiel</span><button id="zurueck">← ZURÜCK</button></div>
    <div class="spinhalt" id="spinhalt"></div>
  </div>

  <footer>Kostenlos. Offen. Kein Ton. Keine ROMs. Nicht mit echten Nutzern getestet.</footer>
</div>
<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};

/* Sound + Konfetti + Highscore — rein im Browser, kein WAV */
var actx=null;
function ton(ok){
  try{
    if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended")actx.resume();
    var o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;
    o.type=ok?"square":"sawtooth";
    o.frequency.setValueAtTime(ok?660:180,t);
    if(ok)o.frequency.exponentialRampToValueAtTime(990,t+.1);
    else o.frequency.exponentialRampToValueAtTime(90,t+.2);
    g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);
    o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+.26);
  }catch(e){}
}
function konfetti(){
  var farben=["#f7d51d","#5ac8fa","#7fe08a","#e0703c","#b03030"];
  for(var i=0;i<24;i++){
    var k=document.createElement("div");k.className="konfetti";
    k.style.left=(Math.random()*100)+"vw";k.style.top="-12px";
    k.style.background=farben[i%farben.length];
    k.style.animationDelay=(Math.random()*.2)+"s";
    document.body.appendChild(k);
    setTimeout((function(el){return function(){el.remove()};})(k),1300);
  }
}
function high(key,punkte){
  try{
    var alt=parseInt(localStorage.getItem("er-high-"+key)||"0",10)||0;
    if(punkte>alt)localStorage.setItem("er-high-"+key,String(punkte));
    return Math.max(alt,punkte);
  }catch(e){return punkte}
}
function rang(p){
  return p>=20?"GOLD ★":p>=10?"SILBER ★":p>=5?"BRONZE ★":"NOCH ÜBEN";
}
var grid=$("#grid"), spiel=$("#spiel"), halt=$("#spinhalt"), titel=$("#sptitel");

// 28 Spiele. Jedes mit Thema, Titel, Art und Inhalt.
var spiele=[
 {tag:"Demo",titel:"Boing Ball",art:"klick",beschr:"Fang den karierten Ball"},
 {tag:"Musik",titel:"Musik wird Bild",art:" quiz",beschr:"Welcher Ton passt?",
  fragen:[{f:"Was macht ein Visualizer?",a:["Er macht Bilder zum Ton","Er backt Brot","Er fährt Auto"],r:0,e:"Ein Visualizer macht Bilder. Die Bilder bewegen sich mit der Musik."}]},
 {tag:"Amiga",titel:"Musikplayer",art:"quiz",beschr:"Modul-Formate raten",
  fragen:[{f:"Was ist ein MOD?",a:["Ein Amiga-Musikformat","Ein Kuchen","Ein Auto"],r:0,e:"MOD war das klassische Amiga-Musikformat. Vier Kanäle."}]},
 {tag:"Paula",titel:"Sound anhören",art:"quiz",beschr:"Paula-Chip Wissen",
  fragen:[{f:"Wie viele Kanäle hatte Paula?",a:["4","16","2"],r:0,e:"Paula hatte 4 Kanäle. Jeder konnte ein Sample spielen."}]},
 {tag:"Demo",titel:"Feldgenerator",art:"quiz",beschr:"Feld-Fragen",
  fragen:[{f:"Was verändert das Feld?",a:["Form und Farben","Den Mond","Das Wetter"],r:0,e:"Im Feldgenerator kannst du Form und Farben ändern."}]},
 {tag:"Studio",titel:"Frei gestalten",art:"quiz",beschr:"Design-Fragen",
  fragen:[{f:"Was heißt hier ‚frei gestalten'?",a:["Du entscheidest","Nichts geht","Nur Grau"],r:0,e:"Du entscheidest. Farben, Schrift, Größe — alles ist offen."}]},
 {tag:"Studio",titel:"Alle Prompts",art:"quiz",beschr:"Prompt-Wissen",
  fragen:[{f:"Was ist ein Prompt?",a:["Ein Auftrag an die KI","Ein Fehler","Eine Datei"],r:0,e:"Ein Prompt ist ein Auftrag. Du sagst der KI, was sie tun soll."}]},
 {tag:"Eine Datei",titel:"Standalone",art:"quiz",beschr:"Offline-Wissen",
  fragen:[{f:"Was heißt standalone?",a:["Läuft allein","Braucht das Netz","Ist ein Spiel"],r:0,e:"Standalone heißt: eine Datei. Läuft ohne Internet."}]},
 {tag:"Kurs",titel:"Computer Chronik",art:"quiz",beschr:"Geschichte timeline",
  fragen:[{f:"Wann kam der C64?",a:["1982","1999","2007"],r:0,e:"Der C64 kam 1982. Er war sehr beliebt."}]},
 {tag:"Zeittafel",titel:"Microsoft",art:"quiz",beschr:"Microsoft-Fragen",
  fragen:[{f:"Wer gründete Microsoft?",a:["Bill Gates und Paul Allen","Steve Jobs","Jack Tramiel"],r:0,e:"Bill Gates und Paul Allen gründeten Microsoft. 1975."}]},
 {tag:"Geschichte",titel:"BOINC",art:"quiz",beschr:"BOINC-Wissen",
  fragen:[{f:"Was macht BOINC?",a:["Verbindet Rechner für Forschung","Macht Kaffee","Spielt Spiele"],r:0,e:"BOINC verbindet viele Rechner. Sie helfen der Wissenschaft."}]},
 {tag:"Kurs",titel:"Code lernen",art:"quiz",beschr:"Code-Fragen",
  fragen:[{f:"Was ist PRINT?",a:["Gibt Text aus","Löscht alles","Ist ein Fehler"],r:0,e:"PRINT schreibt Text. Auf dem C64 und in BASIC."}]},
 {tag:"Für Kids",titel:"Crash Course",art:"quiz",beschr:"Computer für Kids",
  fragen:[{f:"Was ist ein Programm?",a:["Eine Liste mit Schritten","Ein Tier","Ein Ball"],r:0,e:"Ein Programm ist eine Liste. Der Computer liest sie Schritt für Schritt."}]},
 {tag:"Nur Commodore",titel:"Commodore Kurs",art:"quiz",beschr:"Commodore-Fragen",
  fragen:[{f:"Welcher Commodore kam 1977?",a:["PET 2001","C64","Amiga"],r:0,e:"Der PET 2001 kam 1977. Er war der erste."}]},
 {tag:"Start",titel:"Ohne Wissen",art:"quiz",beschr:"0+ verstehen",
  fragen:[{f:"Was bedeutet 0+?",a:["Kein Vorwissen nötig","Für Babys","Null Computer"],r:0,e:"0+ heißt: Du brauchst nichts zu wissen. Es ist kein Kinderbuch."}]},
 {tag:"Sinn",titel:"Kontext",art:"quiz",beschr:"Wort-Bedeutung",
  fragen:[{f:"Was ändert Kontext?",a:["Die Bedeutung eines Worts","Das Wetter","Den Preis"],r:0,e:"Kontext ändert die Bedeutung. Ein Wort kann zwei Sachen heißen."}]},
 {tag:"Web",titel:"Ein Programm im Web",art:"quiz",beschr:"CGI-Wissen",
  fragen:[{f:"Was ist CGI?",a:["Ein Programm im Web","Ein Kabel","Ein Spiel"],r:0,e:"CGI ist ein Programm. Es bekommt eine Frage und antwortet."}]},
 {tag:"Form",titel:"Kunst und Design",art:"quiz",beschr:"Design-Fragen",
  fragen:[{f:"Was ist eine Farbe mit hohem Kontrast?",a:["Schwarz auf Weiß","Grau auf Grau","Weiß auf Gelb"],r:0,e:"Schwarz auf Weiß hat hohen Kontrast. Das ist gut lesbar."}]},
 {tag:"Klang",titel:"Musik",art:"quiz",beschr:"Musik-Fragen",
  fragen:[{f:"Was ist ein Takt?",a:["Der Rhythmus","Der Text","Die Farbe"],r:0,e:"Der Takt ist der Rhythmus. Er gibt den Beat vor."}]},
 {tag:"Prüfen",titel:"Gesundheit",art:"quiz",beschr:"Text prüfen",
  fragen:[{f:"Was tun bei Gesundheits-Texten?",a:["Frag eine Ärztin","Glaub alles","Kauf sofort"],r:0,e:"Frag eine Fachperson. Bei Gesundheit gilt: nachfragen."}]},
 {tag:"中文",titel:"Chinesisch",art:"quiz",beschr:"中文小测",
  fragen:[{f:"电脑是什么意思?",a:["Computer","Haus","Ball"],r:0,e:"电脑 heißt Computer. 电 ist Strom, 脑 ist Gehirn."}]},
 {tag:"MorphOS 3.21",titel:"Der eine Weg",art:"quiz",beschr:"MorphOS-Fragen",
  fragen:[{f:"Worauf läuft MorphOS?",a:["PowerPC","C64","x86"],r:0,e:"MorphOS läuft auf PowerPC. Der Desktop heißt Ambient."}]},
 {tag:"OS 4.1",titel:"Der andere Weg",art:"quiz",beschr:"AmigaOS-Fragen",
  fragen:[{f:"Wer macht AmigaOS 4.1?",a:["Hyperion","Commodore","Apple"],r:0,e:"Hyperion entwickelt AmigaOS 4.1. Die Workbench ist blau."}]},
 {tag:"Interne App",titel:"AROS One im RAM",art:"quiz",beschr:"AROS-Fragen",
  fragen:[{f:"Was ist AROS?",a:["Ein freies Amiga-System","Ein Spiel","Ein ROM"],r:0,e:"AROS ist ein freies Betriebssystem. Es ist wie ein Amiga."}]},
 {tag:"Fehler",titel:"Melden",art:"quiz",beschr:"Feedback-Fragen",
  fragen:[{f:"Wie meldet man einen Fehler?",a:["Per Issue","Mit dem Telefon","Mit einem Video"],r:0,e:"Schriftlich! Ein Issue auf GitHub reicht. Kein Anruf nötig."}]},
 {tag:"Text",titel:"Verbessern",art:"quiz",beschr:"Text-Fragen",
  fragen:[{f:"Was hilft bei schweren Texten?",a:["Kurze Sätze","Lange Wörter","Viele Seiten"],r:0,e:"Kurze Sätze. Alltagswörter. Ein Gedanke pro Absatz."}]},
 {tag:"Sprache",titel:"Übersetzen",art:"quiz",beschr:"Sprach-Fragen",
  fragen:[{f:"In wie vielen Sprachen ist der Witz?",a:["6","2","20"],r:0,e:"Der Witz ist in sechs Sprachen. Deutsch, Englisch, Spanisch, Französisch, Portugiesisch, Italienisch."}]},
 {tag:"Code",titel:"Bauen",art:"quiz",beschr:"Bau-Fragen",
  fragen:[{f:"Was baut man im Kurs?",a:["Demos und Spiele","Autos","Häuser"],r:0,e:"Du baust Demos, Spiele und kleine Programme."}]}
];

// Karten erzeugen
spiele.forEach(function(s,i){
  var k=document.createElement("div");k.className="karte";
  k.style.setProperty("--akz",["var(--c05)","var(--c03)","var(--c10)","var(--c06)","var(--c09)"][i%5]);
  k.innerHTML='<div class="tag">'+s.tag+'</div><h3>'+s.titel+'</h3><p>'+s.beschr+'</p>';
  k.onclick=function(){oeffne(s)};
  grid.appendChild(k);
});

var lauf=false;
function oeffne(s){
  titel.textContent=s.titel;
  halt.innerHTML="";
  spiel.classList.add("offen");
  window.scrollTo({top:grid.offsetTop-10,behavior:"smooth"});
  if(s.art==="klick")klickSpiel(s.titel);else quizSpiel(s.fragen,s.titel);
}
$("#zurueck").onclick=function(){
  spiel.classList.remove("offen");lauf=false;
  halt.innerHTML="";
  window.scrollTo({top:0,behavior:"smooth"});
};

function quizSpiel(fragen,schluessel){
  var i=0,punkte=0,aktiv=true;
  schluessel=schluessel||"quiz";
  var f=document.createElement("p");f.className="frage";
  var a=document.createElement("div");a.className="antworten";
  var e=document.createElement("div");e.className="erk";e.hidden=true;
  var st=document.createElement("div");st.className="stand";
  var w=document.createElement("button");w.className="btn";w.textContent="NÄCHSTE";w.hidden=true;
  halt.appendChild(f);halt.appendChild(a);halt.appendChild(e);halt.appendChild(st);halt.appendChild(w);
  function zeige(){
    var q=fragen[i];f.textContent=q.f;a.innerHTML="";e.hidden=true;w.hidden=true;aktiv=true;
    st.innerHTML="Frage "+(i+1)+" / "+fragen.length+" · Punkte <span class='high'>"+punkte+
      "</span> · <span class='rang'>"+rang(punkte)+"</span> · Rekord "+high(schluessel,punkte);
    q.a.forEach(function(txt,n){
      var b=document.createElement("button");b.type="button";b.textContent=txt;
      b.onclick=function(){
        if(!aktiv)return;aktiv=false;
        if(n===q.r){b.classList.add("right");punkte++;ton(true);konfetti();}
        else{b.classList.add("wrong");a.children[q.r].classList.add("right");ton(false);}
        e.textContent=q.e;e.hidden=false;w.hidden=false;
        st.innerHTML="Frage "+(i+1)+" / "+fragen.length+" · Punkte <span class='high'>"+punkte+
          "</span> · <span class='rang'>"+rang(punkte)+"</span> · Rekord "+high(schluessel,punkte);
        if(i===fragen.length-1)w.textContent="NOCHMAL";
      };
      a.appendChild(b);
    });
  }
  w.onclick=function(){i=(i+1)%fragen.length;if(i===0)punkte=0;w.textContent="NÄCHSTE";zeige()};
  zeige();
}

function klickSpiel(schluessel){
  var treffer=0,zeit=20,timer=null;
  schluessel=schluessel||"klick";
  var feld=document.createElement("div");feld.className="klickfeld";
  var info=document.createElement("div");info.className="stand";
  var ball=document.createElement("div");ball.className="klickball";
  feld.appendChild(ball);halt.appendChild(feld);halt.appendChild(info);
  function move(){
    var w=feld.clientWidth-38,h=feld.clientHeight-38;
    ball.style.transform="translate("+(Math.random()*w)+"px,"+(Math.random()*h)+"px)";
  }
  function poof(x,y){
    var p=document.createElement("div");p.className="poof";p.textContent="+1";
    p.style.left=x+"px";p.style.top=y+"px";feld.appendChild(p);
    setTimeout(function(){p.remove()},600);
  }
  ball.onclick=function(e){
    treffer++;ton(true);
    info.innerHTML="Treffer: <span class='high'>"+treffer+"</span> · Zeit: "+zeit+
      " · <span class='rang'>"+rang(treffer)+"</span> · Rekord "+high(schluessel,treffer);
    var r=feld.getBoundingClientRect();
    poof(e.clientX-r.left,e.clientY-r.top);move();
    if(treffer===5||treffer===10||treffer===20)konfetti();
  };
  timer=setInterval(function(){
    zeit--;info.textContent="Treffer: "+treffer+" · Zeit: "+zeit;
    if(zeit<=0){clearInterval(timer);ball.remove();info.textContent="FERTIG! "+treffer+" Treffer.";}
  },1000);
  info.textContent="Treffer: 0 · Zeit: "+zeit;
  move();
}
})();
</script>
</body>
</html>
