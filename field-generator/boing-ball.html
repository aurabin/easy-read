<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boing Ball — die reine Amiga-Demo</title>
<style>
  :root{--bg:#070b14;--panel:#0e1626;--ink:#eaf2ff;--muted:#9fb3d1;
    --line:#24344f;--teal:#0f766e;--sky:#6fd3ff;--violet:#7a20d0;
    --red:#e8382f;--cream:#f5f0e6}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
  #start{position:fixed;inset:0;z-index:5;display:grid;place-content:center;
    justify-items:center;gap:12px;text-align:center;background:var(--bg);overflow:hidden}
  #start .grid{position:absolute;inset:0 0 auto 0;height:340px;pointer-events:none;
    background-image:linear-gradient(rgba(122,32,208,.22) 1px,transparent 1px),
      linear-gradient(90deg,rgba(122,32,208,.22) 1px,transparent 1px);
    background-size:32px 32px;-webkit-mask-image:linear-gradient(180deg,#000,transparent);
    mask-image:linear-gradient(180deg,#000,transparent)}
  #start .stripe{position:relative;width:104px;height:4px;border-radius:2px;
    background:repeating-linear-gradient(90deg,var(--red) 0 12px,var(--cream) 12px 24px)}
  #start h1{position:relative;margin:0;font-size:clamp(22px,4vw,34px);line-height:1.15}
  #start p,#start small{position:relative;color:var(--muted);max-width:42ch}
  button{cursor:pointer;font:inherit;color:var(--ink);background:var(--panel);
    border:1px solid var(--line);border-radius:8px;padding:9px 16px;
    transition:border-color .15s,transform .15s}
  button:hover{border-color:var(--sky);transform:translateY(-2px)}
  button:focus-visible{outline:2px solid var(--sky);outline-offset:3px}
  #go{position:relative;background:var(--teal);border-color:var(--teal);color:#fff}
  .hidden{display:none!important}
  #wrap{height:100%;display:grid;place-content:center;justify-items:center;gap:10px}
  canvas{width:min(96vw,960px);height:auto;image-rendering:pixelated;
    border:1px solid var(--line);border-radius:8px;box-shadow:0 18px 40px rgba(0,0,0,.5)}
  .bar{display:flex;gap:8px}
  small{color:var(--muted)}
  a{color:var(--sky)}
  a:focus-visible{outline:2px solid var(--sky);outline-offset:3px}
  .modes{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;position:relative}
  .modes button{font:11px ui-monospace,Consolas,monospace;padding:5px 9px;border-radius:99px}
  .modes button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
  .cap{position:relative;min-height:26px;color:var(--sky);
    font:600 16px ui-monospace,Consolas,monospace;letter-spacing:.1em}
  body[data-mode="cb"]{--red:#1d6fb8;--cream:#f7fbff;--violet:#3b5bdb;--sky:#ffd166}
  body[data-mode="low"]{font-size:19px;--muted:#d6e4f7;--line:#7186a5}
  body[data-mode="low"] #start .grid{display:none}
  body[data-mode="low"] canvas{border-width:2px}
  body[data-mode="deaf"] .cap{font-size:26px;color:#fff}
  @media(prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<div id="start">
  <div class="grid" aria-hidden="true"></div>
  <div class="stripe" aria-hidden="true"></div>
  <h1>Boing Ball</h1>
  <p>Die reine Amiga-Demo. 320×200, violettes Gitter, karierte Kugel.</p>
  <button id="go" type="button" autofocus>Press Enter to start</button>
  <div class="modes" role="group" aria-label="Anzeige-Modi">
    <button type="button" data-mode-btn="cb" aria-pressed="false">Farbenblind</button>
    <button type="button" data-mode-btn="low" aria-pressed="false">Sehbehindert</button>
    <button type="button" data-mode-btn="deaf" aria-pressed="false">Gehörlos</button>
  </div>
  <small><a href="index.html">Startseite</a> · Offen · selbst gezeichnet · nicht mit echten Nutzern getestet</small>
</div>
<div id="wrap" class="hidden">
  <canvas id="cv" width="320" height="200" role="img" aria-label="Ein karierter Ball auf einer Acht-Bahn vor einem violetten Drahtgitter."></canvas>
  <div id="cap" class="cap" aria-live="polite"></div>
  <div class="bar"><button id="sound" type="button" aria-pressed="false">Sound: off</button><button id="pause" type="button">Pause</button></div>
  <div class="modes" role="group" aria-label="Anzeige-Modi">
    <button type="button" data-mode-btn="cb" aria-pressed="false">Farbenblind</button>
    <button type="button" data-mode-btn="low" aria-pressed="false">Sehbehindert</button>
    <button type="button" data-mode-btn="deaf" aria-pressed="false">Gehörlos</button>
  </div>
  <small><a href="index.html">Startseite</a> · 1984-Stil-Hommage · Acht-Loop · Enter = Pause</small>
</div>

<script>
(() => {
  "use strict";
  const isCB = () => document.body.dataset.mode === "cb";
  let capTimer = null;
  function showCap(){
    const c = document.getElementById("cap"); if(!c) return;
    c.textContent = "BOING!";
    clearTimeout(capTimer);
    capTimer = setTimeout(()=>{ c.textContent = ""; }, 420);
  }
  const $ = s => document.querySelector(s);
  const cv = $("#cv"), g = cv.getContext("2d");
  const W = 320, H = 200;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)");
  const S = { t:0, started:false, paused:false, calm:reduce.matches, sound:false, audio:null, raf:null, by:0, prevBy:null, prevDir:0 };
  const ball = { ay:0.35, ax:0.2, squash:0 };
  let boingPending = false;

  function boing(){
    if(!S.sound) return;
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      if(!S.audio) S.audio = new AC();
      const c = S.audio;
      const play = () => {
        const t = c.currentTime, o = c.createOscillator(), gn = c.createGain();
        o.type="sine"; o.frequency.setValueAtTime(220,t); o.frequency.exponentialRampToValueAtTime(70,t+.28);
        gn.gain.setValueAtTime(.35,t); gn.gain.exponentialRampToValueAtTime(.001,t+.32);
        o.connect(gn); gn.connect(c.destination); o.start(t); o.stop(t+.34);
      };
      if(c.state === "suspended"){
        if(boingPending) return;
        boingPending = true;
        c.resume().then(()=>{ boingPending=false; play(); }).catch(()=>{ boingPending=false; });
      } else play();
    }catch(e){}
  }

  function sphere(x,y,rx,ry,cycle){
    const lat=8,lon=10;
    const rot=(px,py,pz)=>{const cy=Math.cos(ball.ay),sy=Math.sin(ball.ay),cx=Math.cos(ball.ax),sx=Math.sin(ball.ax);
      const x1=px*cy+pz*sy,z1=-px*sy+pz*cy;return{x:x1,y:py*cx-z1*sx,z:py*sx+z1*cx};};
    const quads=[];
    for(let i=0;i<lat;i++){const l1=-Math.PI/2+i*Math.PI/lat,l2=-Math.PI/2+(i+1)*Math.PI/lat;
      for(let j=0;j<lon;j++){const g1=j*2*Math.PI/lon,g2=(j+1)*2*Math.PI/lon;
        const c4=[[l1,g1],[l1,g2],[l2,g2],[l2,g1]];let d=0;
        const pts=c4.map(([la,lo])=>{const cp=Math.cos(la);const p=rot(cp*Math.cos(lo),Math.sin(la),cp*Math.sin(lo));d+=p.z;return{x:p.x*rx,y:-p.y*ry};});
        d/=4;if(d<=.02)continue;quads.push({d,i,j,pts});}}
    quads.sort((a,b)=>a.d-b.d);
    g.save();g.translate(x,y);
    for(const q of quads){
      g.beginPath();g.moveTo(q.pts[0].x,q.pts[0].y);for(let k=1;k<4;k++)g.lineTo(q.pts[k].x,q.pts[k].y);g.closePath();
      g.fillStyle=((q.i+q.j+cycle)%2===0)?(isCB()?"#1d6fb8":"#e8382f"):(isCB()?"#f7fbff":"#f5f0e6");g.fill();}
    g.restore();
  }

  function draw(){
    g.fillStyle="#9a9a9a";g.fillRect(0,0,W,H);
    g.strokeStyle=isCB()?"#3b5bdb":"#7a20d0";g.lineWidth=1;g.globalAlpha=.9;
    for(let y=12;y<104;y+=13){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke();}
    for(let x=0;x<=W;x+=26){g.beginPath();g.moveTo(x,0);g.lineTo(x,104);g.stroke();}
    for(let k=1;k<=9;k++){const y=104+Math.pow(k/9,1.8)*96;g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke();}
    for(let x=-W;x<=W*2;x+=40){g.beginPath();g.moveTo(160,104);g.lineTo(x,H);g.stroke();}
    g.globalAlpha=1;

    const t=S.t*.85;
    const x=160+Math.sin(t)*96;
    const y=100+Math.sin(t*2)*30;
    const r=22*(.92+.08*Math.sin(t*2+1));
    S.by=y;
    const sq=ball.squash*.18;
    g.fillStyle="rgba(0,0,0,.38)";
    g.beginPath();g.ellipse(x+14,y-5,r*.9*(1+sq),r*.6*(1-sq),0,0,7);g.fill();
    sphere(x,y,r*(1+sq),r*(1-sq),Math.floor(S.t*7)%2);

    g.fillStyle="#d8d8d8";g.fillRect(0,0,W,15);
    g.fillStyle="#1a1a1a";g.fillRect(0,0,W,3);
    g.fillStyle="#e8382f";g.fillRect(6,6,3,6);
    g.fillStyle="#3b82f6";g.fillRect(12,6,3,6);
    g.fillStyle="#1a1a1a";g.font="8px monospace";g.fillText("Workbench",22,12);
  }

  function loop(){
    if(S.paused)return;
    S.t+=.016; ball.ay+=.03; ball.ax=.25; ball.squash*=.86;
    draw();
    if(S.prevBy!==null){
      const dir=S.by-S.prevBy;
      if(S.prevDir>0 && dir<=0){ ball.squash=1; showCap(); boing(); }
      S.prevDir=dir;
    }
    S.prevBy=S.by;
    S.raf=requestAnimationFrame(loop);
  }
  function start(){ $("#start").classList.add("hidden"); $("#wrap").classList.remove("hidden"); S.started=true; draw(); if(!S.calm)loop(); }
  $("#go").addEventListener("click",start);
  window.addEventListener("keydown",e=>{ if(e.key==="Enter"){ if(!S.started)start(); else $("#pause").click(); } });
  $("#pause").addEventListener("click",()=>{
    S.paused=!S.paused;$("#pause").textContent=S.paused?"Play":"Pause";
    if(S.paused){cancelAnimationFrame(S.raf);}else{loop();}
  });
  $("#sound").addEventListener("click",()=>{S.sound=!S.sound;const b=$("#sound");b.textContent="Sound: "+(S.sound?"on":"off");b.setAttribute("aria-pressed",String(S.sound));if(S.sound&&(!S.started||S.paused||S.calm))boing();});
  reduce.addEventListener("change",e=>{S.calm=e.matches;if(S.calm)cancelAnimationFrame(S.raf);else if(S.started&&!S.paused)loop();});
  draw();
  $("#go").focus();
})();
</script>
<script>
/* Anzeige-Modi: eine Wahl für alle Seiten */
(function(){
  var m = localStorage.getItem("er-mode") || "";
  function apply(){
    document.body.dataset.mode = m;
    var bs = document.querySelectorAll("[data-mode-btn]");
    for(var i=0;i<bs.length;i++)
      bs[i].setAttribute("aria-pressed", String(bs[i].getAttribute("data-mode-btn")===m));
  }
  document.addEventListener("click", function(e){
    var b = e.target.closest && e.target.closest("[data-mode-btn]");
    if(!b) return;
    var v = b.getAttribute("data-mode-btn");
    m = (m===v) ? "" : v;
    localStorage.setItem("er-mode", m);
    apply();
  });
  apply();
})();
</script>
</body>
</html>
