<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-label="A Busicom 141-PF printing calculator with keyboard and paper roll.">
  <defs>
    <linearGradient id="calc-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16233d" /><stop offset="1" stop-color="#070b14" /></linearGradient>
    <radialGradient id="calc-vig" cx=".5" cy=".45" r=".8"><stop offset="0.55" stop-color="#000" stop-opacity='0'/><stop offset="1" stop-color="#000" stop-opacity='.5'/></radialGradient>
