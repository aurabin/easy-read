  <g stroke="#6fd3ff" stroke-width="1" opacity=".6"><path d="M136 64 h128"/><path d="M136 80 h128"/><path d="M136 96 h128"/><path d="M136 112 h128"/><path d="M136 128 h128"/><path d="M136 144 h128"/><path d="M136 160 h128"/><path d="M136 176 h128"/><path d="M136 192 h128"/><path d="M144 60 v140"/><path d="M162 60 v140"/><path d="M180 60 v140"/><path d="M198 60 v140"/><path d="M216 60 v140"/><path d="M234 60 v140"/><path d="M252 60 v140"/></g>
