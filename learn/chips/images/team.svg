  <text x="74" y="158" font-size="12" fill="#eaf2ff" font-family="system-ui" text-anchor="middle">HOFF</text></g>
  <g><ellipse cx="146" cy="122" rx="18" ry="5" fill="#000" opacity=".3"/>
  <path d="M136 84 q10 -7 20 0 l3 34 q-13 7 -26 0 z" fill="#3b82f6"/>
  <circle cx="146" cy="70" r="9" fill="#e8b48a"/>
  <text x="146" y="132" font-size="12" fill="#eaf2ff" font-family="system-ui" text-anchor="middle">FAGGIN</text></g>
