  <path d="M316 110 q10 -7 20 0 l3 34 q-13 7 -26 0 z" fill="#2f9e44"/>
  <circle cx="326" cy="96" r="9" fill="#e8b48a"/>
  <text x="326" y="158" font-size="12" fill="#eaf2ff" font-family="system-ui" text-anchor="middle">SHIMA</text></g>
