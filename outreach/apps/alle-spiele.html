<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alle Spiele — Boing Ball Demo Style</title>
<style>
/* Boing-Ball-Demo-Stil: Nachtgitter, violettes Gitter, karierter Ball */
:root{--bg:#070b14;--panel:#0e1626;--ink:#eaf2ff;--muted:#9fb3d1;
 --line:#24344f;--teal:#0f766e;--sky:#6fd3ff;--violet:#7a20d0;
 --red:#e8382f;--cream:#f5f0e6}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
 font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
/* Hintergrund-Gitter wie im Boing-Ball-Startbildschirm */
body::before{content:"";position:fixed;inset:0 0 auto 0;height:420px;pointer-events:none;
 background-image:linear-gradient(rgba(122,32,208,.18) 1px,transparent 1px),
   linear-gradient(90deg,rgba(122,32,208,.18) 1px,transparent 1px);
 background-size:32px 32px;-webkit-mask-image:linear-gradient(180deg,#000,transparent);
 mask-image:linear-gradient(180deg,#000,transparent)}
.wrap{position:relative;max-width:1000px;margin:0 auto;padding:20px 16px 70px}
.stripe{width:104px;height:4px;border-radius:2px;margin-bottom:16px;
 background:repeating-linear-gradient(90deg,var(--red) 0 12px,var(--cream) 12px 24px)}
h1{font-size:clamp(24px,4vw,36px);margin:0 0 4px;line-height:1.15}
h1 span{color:var(--sky)}
.lead{color:var(--muted);margin:0 0 18px;max-width:60ch}
/* Demo-Startknopf */
.startbar{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
button,.btn{cursor:pointer;font:inherit;color:var(--ink);background:var(--panel);
 border:1px solid var(--line);border-radius:8px;padding:9px 16px;transition:border-color .15s,transform .15s}
button:hover,.btn:hover{border-color:var(--sky);transform:translateY(-2px)}
button:focus-visible,.btn:focus-visible{outline:2px solid var(--sky);outline-offset:3px}
.go{background:var(--teal);border-color:var(--teal);color:#fff}
.cap{min-height:26px;color:var(--sky);font:600 16px ui-monospace,Consolas,monospace;letter-spacing:.1em}
/* Karten-Raster */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
.karte{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;
 cursor:pointer;transition:border-color .15s,transform .15s,border-color .15s}
.karte:hover{border-color:var(--sky);transform:translateY(-3px)}
.karte .tag{font:11px ui-monospace,Consolas,monospace;color:var(--teal);text-transform:uppercase;letter-spacing:.1em}
.karte h3{margin:6px 0 4px;font-size:16px}
.karte p{margin:0;color:var(--muted);font-size:13px}
.karte:nth-child(3n) .tag{color:var(--sky)}
.karte:nth-child(3n+2) .tag{color:var(--violet)}
/* Spiel-Fenster */
#spiel{display:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;
 box-shadow:0 18px 40px rgba(0,0,0,.5);margin-top:20px;overflow:hidden}
#spiel.offen{display:block}
.spkopf{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 14px;
 display:flex;justify-content:space-between;align-items:center}
.spkopf b{color:var(--sky);font:600 14px ui-monospace,Consolas,monospace;letter-spacing:.06em}
.spinhalt{padding:18px;min-height:230px}
.frage{font-size:18px;color:var(--cream);margin:0 0 14px}
.antworten{display:flex;flex-direction:column;gap:8px}
.antworten button{text-align:left;background:#131f36;border:1px solid var(--line);
 border-radius:6px;padding:10px 12px}
.antworten button:hover{border-color:var(--sky)}
.antworten button.right{background:var(--teal);border-color:var(--teal);color:#fff}
.antworten button.wrong{background:#7a2020;border-color:var(--red)}
.erk{margin-top:12px;padding:10px;background:#0a1220;border-left:3px solid var(--sky);
 color:var(--muted)}
.erk[hidden]{display:none}
.stand{margin-top:10px;color:var(--muted);font:12px ui-monospace,Consolas,monospace}
.high{color:var(--sky)}
.rang{color:var(--cream)}
/* Klick-Spiel */
.klickfeld{height:190px;background:var(--panel);border:1px solid var(--line);
 border-radius:6px;position:relative;overflow:hidden;
 background-image:linear-gradient(rgba(122,32,208,.2) 1px,transparent 1px),
   linear-gradient(90deg,rgba(122,32,208,.2) 1px,transparent 1px);
 background-size:24px 24px}
.klickball{position:absolute;width:40px;height:40px;border-radius:50%;cursor:pointer;
 background:radial-gradient(circle at 35% 30%,var(--cream),var(--red));
 box-shadow:inset -3px -3px 0 rgba(0,0,0,.25)}
.klickball::before,.klickball::after{content:"";position:absolute;top:9px;width:5px;height:5px;background:#111;border-radius:50%}
.klickball::before{left:11px}.klickball::after{right:11px}
.poof{position:absolute;color:var(--sky);font:600 16px ui-monospace,monospace;
 pointer-events:none;animation:pop .6s forwards}
@keyframes pop{to{transform:translateY(-35px);opacity:0}}
.konfetti{position:fixed;width:8px;height:8px;pointer-events:none;z-index:99;animation:fall 1s forwards}
@keyframes fall{to{transform:translateY(100vh) rotate(720deg);opacity:0}}
footer{text-align:center;color:var(--muted);font-size:12px;padding:16px}
a{color:var(--sky)}
@media(prefers-reduced-motion:reduce){*{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="stripe" aria-hidden="true"></div>
  <h1>ALLE SPIELE <span>— BOING BALL STYLE</span></h1>
  <p class="lead">28 Mini-Spiele. Eins für jedes Thema. Im Look der Amiga-Demo.</p>
  <div class="startbar">
    <button class="go" id="showgames">SPIELE ZEIGEN</button>
    <div class="cap" id="cap">BEREIT. DRÜCK AUF START.</div>
  </div>
  <div class="grid" id="grid" style="display:none"></div>

  <div id="spiel">
    <div class="spkopf"><b id="sptitel">Spiel</b><button id="zurueck">← ZURÜCK</button></div>
    <div class="spinhalt" id="spinhalt"></div>
  </div>

  <footer>Kostenlos. Offen. Kein WAV. Keine ROMs. Nicht mit echten Nutzern getestet.</footer>
</div>
<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
var grid=$("#grid"),spiel=$("#spiel"),halt=$("#spinhalt"),titel=$("#sptitel"),cap=$("#cap");

/* Sound + Konfetti + Highscore — browser-local, kein WAV */
var actx=null;
function ton(ok){try{
 if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();
 if(actx.state==="suspended")actx.resume();
 var o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;
 o.type=ok?"square":"sawtooth";o.frequency.setValueAtTime(ok?660:180,t);
 if(ok)o.frequency.exponentialRampToValueAtTime(990,t+.1);
 else o.frequency.exponentialRampToValueAtTime(90,t+.2);
 g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);
 o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+.26);
}catch(e){}}
function konfetti(){var f=["#6fd3ff","#7a20d0","#0f766e","#e8382f","#f5f0e6"];
 for(var i=0;i<24;i++){var k=document.createElement("div");k.className="konfetti";
  k.style.left=(Math.random()*100)+"vw";k.style.top="-12px";k.style.background=f[i%f.length];
  k.style.animationDelay=(Math.random()*.2)+"s";document.body.appendChild(k);
  setTimeout((function(el){return function(){el.remove()}})(k),1300);}}
function high(key,p){try{var a=parseInt(localStorage.getItem("er-high-"+key)||"0",10)||0;
 if(p>a)localStorage.setItem("er-high-"+key,String(p));return Math.max(a,p)}catch(e){return p}}
function rang(p){return p>=20?"GOLD ★":p>=10?"SILBER ★":p>=5?"BRONZE ★":"NOCH ÜBEN"}

var spiele=[
 {tag:"Demo",titel:"Boing Ball",art:"klick",beschr:"Fang den karierten Ball"},
 {tag:"Musik",titel:"Musik wird Bild",art:"quiz",beschr:"Welcher Ton passt?",fragen:[{f:"Was macht ein Visualizer?",a:["Er macht Bilder zum Ton","Er backt Brot","Er fährt Auto"],r:0,e:"Ein Visualizer macht Bilder. Die Bilder bewegen sich mit der Musik."}]},
 {tag:"Amiga",titel:"Musikplayer",art:"quiz",beschr:"Modul-Formate raten",fragen:[{f:"Was ist ein MOD?",a:["Ein Amiga-Musikformat","Ein Kuchen","Ein Auto"],r:0,e:"MOD war das klassische Amiga-Musikformat. Vier Kanäle."}]},
 {tag:"Paula",titel:"Sound anhören",art:"quiz",beschr:"Paula-Chip Wissen",fragen:[{f:"Wie viele Kanäle hatte Paula?",a:["4","16","2"],r:0,e:"Paula hatte 4 Kanäle. Jeder konnte ein Sample spielen."}]},
 {tag:"Demo",titel:"Feldgenerator",art:"quiz",beschr:"Feld-Fragen",fragen:[{f:"Was verändert das Feld?",a:["Form und Farben","Den Mond","Das Wetter"],r:0,e:"Im Feldgenerator kannst du Form und Farben ändern."}]},
 {tag:"Studio",titel:"Frei gestalten",art:"quiz",beschr:"Design-Fragen",fragen:[{f:"Was heißt hier ‚frei gestalten'?",a:["Du entscheidest","Nichts geht","Nur Grau"],r:0,e:"Du entscheidest. Farben, Schrift, Größe — alles ist offen."}]},
 {tag:"Studio",titel:"Alle Prompts",art:"quiz",beschr:"Prompt-Wissen",fragen:[{f:"Was ist ein Prompt?",a:["Ein Auftrag an die KI","Ein Fehler","Eine Datei"],r:0,e:"Ein Prompt ist ein Auftrag. Du sagst der KI, was sie tun soll."}]},
 {tag:"Eine Datei",titel:"Standalone",art:"quiz",beschr:"Offline-Wissen",fragen:[{f:"Was heißt standalone?",a:["Läuft allein","Braucht das Netz","Ist ein Spiel"],r:0,e:"Standalone heißt: eine Datei. Läuft ohne Internet."}]},
 {tag:"Kurs",titel:"Computer Chronik",art:"quiz",beschr:"Geschichte timeline",fragen:[{f:"Wann kam der C64?",a:["1982","1999","2007"],r:0,e:"Der C64 kam 1982. Er war sehr beliebt."}]},
 {tag:"Zeittafel",titel:"Microsoft",art:"quiz",beschr:"Microsoft-Fragen",fragen:[{f:"Wer gründete Microsoft?",a:["Bill Gates und Paul Allen","Steve Jobs","Jack Tramiel"],r:0,e:"Bill Gates und Paul Allen gründeten Microsoft. 1975."}]},
 {tag:"Geschichte",titel:"BOINC",art:"quiz",beschr:"BOINC-Wissen",fragen:[{f:"Was macht BOINC?",a:["Verbindet Rechner für Forschung","Macht Kaffee","Spielt Spiele"],r:0,e:"BOINC verbindet viele Rechner. Sie helfen der Wissenschaft."}]},
 {tag:"Kurs",titel:"Code lernen",art:"quiz",beschr:"Code-Fragen",fragen:[{f:"Was ist PRINT?",a:["Gibt Text aus","Löscht alles","Ist ein Fehler"],r:0,e:"PRINT schreibt Text. Auf dem C64 und in BASIC."}]},
 {tag:"Für Kids",titel:"Crash Course",art:"quiz",beschr:"Computer für Kids",fragen:[{f:"Was ist ein Programm?",a:["Eine Liste mit Schritten","Ein Tier","Ein Ball"],r:0,e:"Ein Programm ist eine Liste. Der Computer liest sie Schritt für Schritt."}]},
 {tag:"Nur Commodore",titel:"Commodore Kurs",art:"quiz",beschr:"Commodore-Fragen",fragen:[{f:"Welcher Commodore kam 1977?",a:["PET 2001","C64","Amiga"],r:0,e:"Der PET 2001 kam 1977. Er war der erste."}]},
 {tag:"Start",titel:"Ohne Wissen",art:"quiz",beschr:"0+ verstehen",fragen:[{f:"Was bedeutet 0+?",a:["Kein Vorwissen nötig","Für Babys","Null Computer"],r:0,e:"0+ heißt: Du brauchst nichts zu wissen. Es ist kein Kinderbuch."}]},
 {tag:"Sinn",titel:"Kontext",art:"quiz",beschr:"Wort-Bedeutung",fragen:[{f:"Was ändert Kontext?",a:["Die Bedeutung eines Worts","Das Wetter","Den Preis"],r:0,e:"Kontext ändert die Bedeutung. Ein Wort kann zwei Sachen heißen."}]},
 {tag:"Web",titel:"Ein Programm im Web",art:"quiz",beschr:"CGI-Wissen",fragen:[{f:"Was ist CGI?",a:["Ein Programm im Web","Ein Kabel","Ein Spiel"],r:0,e:"CGI ist ein Programm. Es bekommt eine Frage und antwortet."}]},
 {tag:"Form",titel:"Kunst und Design",art:"quiz",beschr:"Design-Fragen",fragen:[{f:"Was ist ein hoher Kontrast?",a:["Schwarz auf Weiß","Grau auf Grau","Weiß auf Gelb"],r:0,e:"Schwarz auf Weiß hat hohen Kontrast. Das ist gut lesbar."}]},
 {tag:"Klang",titel:"Musik",art:"quiz",beschr:"Musik-Fragen",fragen:[{f:"Was ist ein Takt?",a:["Der Rhythmus","Der Text","Die Farbe"],r:0,e:"Der Takt ist der Rhythmus. Er gibt den Beat vor."}]},
 {tag:"Prüfen",titel:"Gesundheit",art:"quiz",beschr:"Text prüfen",fragen:[{f:"Was tun bei Gesundheits-Texten?",a:["Frag eine Ärztin","Glaub alles","Kauf sofort"],r:0,e:"Frag eine Fachperson. Bei Gesundheit gilt: nachfragen."}]},
 {tag:"中文",titel:"Chinesisch",art:"quiz",beschr:"中文小测",fragen:[{f:"电脑是什么意思?",a:["Computer","Haus","Ball"],r:0,e:"电脑 heißt Computer. 电 ist Strom, 脑 ist Gehirn."}]},
 {tag:"MorphOS 3.21",titel:"Der eine Weg",art:"quiz",beschr:"MorphOS-Fragen",fragen:[{f:"Worauf läuft MorphOS?",a:["PowerPC","C64","x86"],r:0,e:"MorphOS läuft auf PowerPC. Der Desktop heißt Ambient."}]},
 {tag:"OS 4.1 FE Update 3",titel:"Der andere Weg",art:"quiz",beschr:"AmigaOS-Fragen",fragen:[{f:"Wer macht AmigaOS 4.1?",a:["Hyperion","Commodore","Apple"],r:0,e:"Hyperion entwickelt AmigaOS 4.1. Die Workbench ist blau."}]},
 {tag:"Interne App",titel:"AROS One im RAM",art:"quiz",beschr:"AROS-Fragen",fragen:[{f:"Was ist AROS?",a:["Ein freies Amiga-System","Ein Spiel","Ein ROM"],r:0,e:"AROS ist ein freies Betriebssystem. Es ist wie ein Amiga."}]},
 {tag:"Fehler",titel:"Melden",art:"quiz",beschr:"Feedback-Fragen",fragen:[{f:"Wie meldet man einen Fehler?",a:["Per Issue","Mit dem Telefon","Mit einem Video"],r:0,e:"Schriftlich! Ein Issue auf GitHub reicht. Kein Anruf nötig."}]},
 {tag:"Text",titel:"Verbessern",art:"quiz",beschr:"Text-Fragen",fragen:[{f:"Was hilft bei schweren Texten?",a:["Kurze Sätze","Lange Wörter","Viele Seiten"],r:0,e:"Kurze Sätze. Alltagswörter. Ein Gedanke pro Absatz."}]},
 {tag:"Sprache",titel:"Übersetzen",art:"quiz",beschr:"Sprach-Fragen",fragen:[{f:"In wie vielen Sprachen ist der Witz?",a:["6","2","20"],r:0,e:"Der Witz ist in sechs Sprachen. Deutsch, Englisch, Spanisch, Französisch, Portugiesisch, Italienisch."}]},
 {tag:"Code",titel:"Bauen",art:"quiz",beschr:"Bau-Fragen",fragen:[{f:"Was baut man im Kurs?",a:["Demos und Spiele","Autos","Häuser"],r:0,e:"Du baust Demos, Spiele und kleine Programme."}]}
];

$("#showgames").onclick=function(){
 grid.style.display="grid";cap.textContent="28 SPIELE BEREIT.";
 this.textContent="SPIELE DA";
 window.scrollTo({top:grid.offsetTop-20,behavior:"smooth"});
};
spiele.forEach(function(s){
 var k=document.createElement("div");k.className="karte";
 k.innerHTML='<div class="tag">'+s.tag+'</div><h3>'+s.titel+'</h3><p>'+s.beschr+'</p>';
 k.onclick=function(){oeffne(s)};grid.appendChild(k);
});
function oeffne(s){
 titel.textContent=s.titel;halt.innerHTML="";spiel.classList.add("offen");
 cap.textContent="★ "+s.titel.toUpperCase()+" ★";
 window.scrollTo({top:spiel.offsetTop-20,behavior:"smooth"});
 if(s.art==="klick")klickSpiel(s.titel);else quizSpiel(s.fragen,s.titel);
}
$("#zurueck").onclick=function(){
 spiel.classList.remove("offen");halt.innerHTML="";cap.textContent="ZURÜCK ZUR AUSWAHL.";
 window.scrollTo({top:grid.offsetTop-20,behavior:"smooth"});
};
function quizSpiel(fragen,key){
 key=key||"quiz";var i=0,punkte=0,aktiv=true;
 var f=document.createElement("p");f.className="frage";
 var a=document.createElement("div");a.className="antworten";
 var e=document.createElement("div");e.className="erk";e.hidden=true;
 var st=document.createElement("div");st.className="stand";
 var w=document.createElement("button");w.className="go";w.textContent="NÄCHSTE";w.hidden=true;
 halt.appendChild(f);halt.appendChild(a);halt.appendChild(e);halt.appendChild(st);halt.appendChild(w);
 function zeige(){
  var q=fragen[i];f.textContent=q.f;a.innerHTML="";e.hidden=true;w.hidden=true;aktiv=true;
  st.innerHTML="Frage "+(i+1)+" / "+fragen.length+" · <span class='high'>Punkte "+punkte+
   "</span> · <span class='rang'>"+rang(punkte)+"</span> · Rekord "+high(key,punkte);
  q.a.forEach(function(txt,n){
   var b=document.createElement("button");b.type="button";b.textContent=txt;
   b.onclick=function(){
    if(!aktiv)return;aktiv=false;
    if(n===q.r){b.classList.add("right");punkte++;ton(true);konfetti();}
    else{b.classList.add("wrong");a.children[q.r].classList.add("right");ton(false);}
    e.textContent=q.e;e.hidden=false;w.hidden=false;
    st.innerHTML="Frage "+(i+1)+" / "+fragen.length+" · <span class='high'>Punkte "+punkte+
     "</span> · <span class='rang'>"+rang(punkte)+"</span> · Rekord "+high(key,punkte);
    if(i===fragen.length-1)w.textContent="NOCHMAL";
   };a.appendChild(b);
  });
 }
 w.onclick=function(){i=(i+1)%fragen.length;if(i===0)punkte=0;w.textContent="NÄCHSTE";zeige()};
 zeige();
}
function klickSpiel(key){
 key=key||"klick";var treffer=0,zeit=20,timer=null;
 var feld=document.createElement("div");feld.className="klickfeld";
 var info=document.createElement("div");info.className="stand";
 var ball=document.createElement("div");ball.className="klickball";
 feld.appendChild(ball);halt.appendChild(feld);halt.appendChild(info);
 function move(){var w=feld.clientWidth-40,h=feld.clientHeight-40;
  ball.style.transform="translate("+(Math.random()*w)+"px,"+(Math.random()*h)+"px)";}
 function poof(x,y){var p=document.createElement("div");p.className="poof";p.textContent="+1";
  p.style.left=x+"px";p.style.top=y+"px";feld.appendChild(p);setTimeout(function(){p.remove()},600);}
 ball.onclick=function(e){treffer++;ton(true);
  info.innerHTML="Treffer: <span class='high'>"+treffer+"</span> · Zeit: "+zeit+
   " · <span class='rang'>"+rang(treffer)+"</span> · Rekord "+high(key,treffer);
  var r=feld.getBoundingClientRect();poof(e.clientX-r.left,e.clientY-r.top);move();
  if(treffer===5||treffer===10||treffer===20)konfetti();};
 timer=setInterval(function(){zeit--;
  info.innerHTML="Treffer: <span class='high'>"+treffer+"</span> · Zeit: "+zeit+
   " · <span class='rang'>"+rang(treffer)+"</span> · Rekord "+high(key,treffer);
  if(zeit<=0){clearInterval(timer);ball.remove();info.textContent="FERTIG! "+treffer+" Treffer.";}},1000);
 info.textContent="Treffer: 0 · Zeit: "+zeit;move();
}
})();
</script>
</body>
</html>
