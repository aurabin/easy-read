<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bild mit Inhalt — Boing Ball aus dem PNG</title>
<style>
:root{--bg:#070b14;--panel:#0e1626;--ink:#eaf2ff;--muted:#9fb3d1;
  --line:#24344f;--teal:#0f766e;--sky:#6fd3ff;--red:#e8382f;--cream:#f5f0e6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:32px 20px 56px}
h1{font-size:clamp(22px,4vw,34px);line-height:1.2;margin:0 0 10px}
p{color:var(--muted);max-width:58ch}
.stripe{width:104px;height:4px;margin:0 0 22px;border-radius:2px;
  background:repeating-linear-gradient(90deg,var(--red) 0 12px,var(--cream) 12px 24px)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:22px}
iframe{width:100%;height:360px;border:1px solid var(--line);border-radius:10px;background:#050810}
a{color:var(--sky)}
a:focus-visible{outline:2px solid var(--sky);outline-offset:3px}
button{cursor:pointer;font:inherit;color:#fff;background:var(--teal);
  border:1px solid var(--teal);border-radius:8px;padding:9px 15px}
.linkrow{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-top:14px}
.status{font:12px ui-monospace,Consolas,monospace;color:var(--sky)}
@media(prefers-reduced-motion:reduce){*{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="stripe" aria-hidden="true"></div>
  <h1>Bild mit Inhalt</h1>
  <p>Dieses PNG trägt zwei Dateien in sich. Die Boing-Ball-Demo startet hier direkt aus dem Bild. Das Musikline-Modul kannst du speichern.</p>

  <div class="card">
    <div class="status" id="status">Lade das Bild …</div>
    <div class="linkrow">
      <button type="button" id="run" disabled>Demo starten</button>
      <a id="mod" hidden>Modul speichern</a>
      <a href="virtual-field-generator.png">PNG ansehen</a>
    </div>
    <iframe id="frame" title="Boing Ball Demo aus dem PNG" hidden></iframe>
  </div>

  <p class="status">Ohne Ton. Das PNG speichert Bilder und Daten, aber keine Tonspur.</p>
</div>

<script>
(async () => {
  const status = document.getElementById("status");
  const run = document.getElementById("run");
  const frame = document.getElementById("frame");
  const modLink = document.getElementById("mod");
  const payload = {};

  function readChunks(buffer){
    const d = new DataView(buffer), u = new Uint8Array(buffer);
    if (u[0]!==137 || u[1]!==80 || u[2]!==78 || u[3]!==71) throw new Error("Kein PNG");
    let p = 8;
    while (p + 12 <= u.length){
      const len = d.getUint32(p);
      const type = String.fromCharCode(...u.subarray(p+4,p+8));
      if (type === "IEND") break;
      if (type === "tEXt"){
        const raw = String.fromCharCode(...u.subarray(p+8,p+8+len));
        const i = raw.indexOf("\0");
        if (i > 0 && raw.slice(0,i).startsWith("ER_PAYLOAD:")){
          const name = raw.slice(11,i);
          const bin = atob(raw.slice(i+1));
          const bytes = new Uint8Array(bin.length);
          for (let k=0;k<bin.length;k++) bytes[k] = bin.charCodeAt(k);
          payload[name] = bytes;
        }
      }
      p += 12 + len;
    }
  }

  try {
    const res = await fetch("virtual-field-generator.png?v=2");
    if (!res.ok) throw new Error("Bild nicht gefunden");
    readChunks(await res.arrayBuffer());
    const names = Object.keys(payload);
    status.textContent = "Gefunden: " + names.join(", ");
    if (payload["boing-ball.html"]){
      run.disabled = false;
    }
    if (payload["Ml.OctaGroover"]){
      const blob = new Blob([payload["Ml.OctaGroover"]], {type:"application/octet-stream"});
      const url = URL.createObjectURL(blob);
      modLink.href = url;
      modLink.download = "Ml.OctaGroover";
      modLink.hidden = false;
    }
  } catch (e) {
    status.textContent = "Fehler: " + e.message;
  }

  run.addEventListener("click", () => {
    const blob = new Blob([new Uint8Array(payload["boing-ball.html"])], {type:"text/html"});
    frame.src = URL.createObjectURL(blob);
    frame.hidden = false;
  });
})();
</script>
</body>
</html>
