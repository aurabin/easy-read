  <rect x="66" y="44" width="132" height="92" rx="6" fill="url(#cd32-scr)" filter="url(#cd32-gl)"/>
  <circle cx="130" cy="90" r="16" fill="url(#cd32-ball)" class="floaty"/>
  <rect x="66" y="44" width="132" height="92" rx="6" fill="none" stroke="rgba(255,255,255,.15)"/><polygon points="79.4,175 200.6,245 200.6,265 79.4,195" fill="#2a2e35" /><polygon points="261.2,210 200.6,245 200.6,265 261.2,230" fill="#1c2026" /><polygon points="140,140 261.2,210 200.6,245 79.4,175" fill="#3a3f47" stroke="rgba(255,255,255,.08)" stroke-width="1"/><rect x="170" y="150" width="70" height="5" fill="#0a0d12"/><circle cx="250" cy="152" r="4" fill="#0a0d12"/>
    <g><rect x="300" y="160" width="52" height="26" rx="10" fill="#2a2e35"/><circle cx="312" cy="172" r="5" fill="#1c2026"/><circle cx="340" cy="170" r="3" fill="#e8382f"/><circle cx="346" cy="176" r="3" fill="#3b82f6"/></g>
    <rect x="0" y="200" width="400" height="40" fill="#0a1120"/>
    <defs><radialGradient id="cd32-ball" cx=".35" cy=".3" r=".95"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#e8382f"/><stop offset="1" stop-color="#8a1d16"/></radialGradient></defs>
  <rect width="400" height="240" filter="url(#cd32-gr)"/>
  <rect width="400" height="240" fill="url(#cd32-vig)"/>
