  <polygon points="173.2,134 200.9,150 200.9,153 173.2,137" fill="#b3852f" /><polygon points="221.7,138 200.9,150 200.9,153 221.7,141" fill="#8a6622" /><polygon points="194,122 221.7,138 200.9,150 173.2,134" fill="#d9a441" stroke="rgba(255,255,255,.08)" stroke-width="1"/>
